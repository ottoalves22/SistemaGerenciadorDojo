{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Novo Aluno</title>

    <link rel="stylesheet" href="{% static 'css/global.css' %}"></head>

<body>

    <header class="site-header">
        <div class="header-container">
            <button id="btn-menu" class="btn-menu">☰</button>
            <h1 class="logo">Ornellas Dojo</h1>
        </div>
    </header>

    <nav id="menu-lateral" class="menu-lateral">
        <ul>
            <li><a href="http://localhost:8000/alunos/">Dashboard</a></li>
            <li><a href="http://localhost:8000/alunos/aluno">Alunos</a></li>
        </ul>
    </nav>

    <main class="container">

        <h2>Novo Aluno</h2>

        <form method="POST" class="form-section">
            {% csrf_token %}

            <div class="form-group">
                <label>Nome</label>
                <input type="text" name="nome" required>
            </div>

            <div class="form-group">
                <label>Data de Nascimento</label>
                <input type="date" name="data_nascimento" required>
            </div>

            <div class="form-group">
                <label>Telefone</label>
                <input type="text" name="telefone" required>
            </div>

            <div class="form-group">
                <label>Mensalidade (R$)</label>
                <input type="number" step="0.01" name="mensalidade" required>
            </div>

            <div class="form-group">
                <label>Status</label>
                <select name="is_active">
                    <option value="True">Ativo</option>
                    <option value="False">Inativo</option>
                </select>
            </div>

            <button type="submit" class="botao">Salvar</button>

        </form>

    </main>

    <script src="{% static 'js/app.js' %}"></script>

</body>

</html>
