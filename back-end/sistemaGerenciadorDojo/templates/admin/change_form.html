{% extends "admin/base_site.html" %}

{% block content %}

<div class="container">

    <h1 class="titulo-secao">

        {% if add %}
        Cadastrar Aluno
        {% else %}
        Editar Aluno
        {% endif %}

    </h1>

    <form method="post">
        {% csrf_token %}

        <div class="form-section">

            {{ adminform.form.as_p }}

            <button class="botao" type="submit">
                Salvar
            </button>

        </div>

    </form>

</div>

{% endblock %}
