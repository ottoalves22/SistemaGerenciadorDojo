version: '3.8'

services:
  db:
    image: postgres:15
    container_name: sgd_postgres
    restart: always
    environment:
      POSTGRES_DB: sgd_db
      POSTGRES_USER: sgd_user
      POSTGRES_PASSWORD: sgd_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  web:
    build: .
    command: uv run python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./sistemaGerenciadorDojo:/app
      - /app/.venv
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
