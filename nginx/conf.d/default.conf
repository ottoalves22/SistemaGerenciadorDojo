#http
server {
    listen 80;
    server_name ornellasdojo.flashhub.net;

    client_max_body_size 20M;

    location /static/ {
        alias /static/;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://sgd_web:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name ornellasdojo.flashhub.net;

    ssl_certificate /etc/letsencrypt/live/ornellasdojo.flashhub.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ornellasdojo.flashhub.net/privkey.pem;

    location / {
        proxy_pass http://sgd_web:8000;        # <-- Nome do serviço Django no compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}