{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ornellas Dojo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'alunos/css/global.css' %}">
</head>

<body>
    <main class="container">
        <section class="form-section" style="max-width:450px;margin:auto;margin-top:80px;">
            <h2>Entrar no Sistema</h2>
            <form id="form-login">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email">
                    <small class="mensagem-erro" id="erro-email"></small>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="senha">
                    <small class="mensagem-erro" id="erro-senha"></small>
                </div>
                <button class="botao" type="submit">Entrar</button>
            </form>
        </section>
    </main>

    <script src="{% static 'alunos/js/app.js' %}"></script>

</body>
</html>
