{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alunos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/global.css' %}">
</head>

<header class="site-header">
    <div class="header-container">
        <button id="btn-menu" class="btn-menu">☰</button>
        <h1 class="logo">Ornellas Dojo</h1>
    </div>
</header>
<nav id="menu-lateral" class="menu-lateral">
    <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="alunos.html">Alunos</a></li>
        <li><a href="#">Turmas</a></li>
        <li><a href="#">Pagamentos</a></li>
    </ul>
</nav>

<body>
    <main class="container">

        <h2>Alunos</h2>

        <div class="topo-acoes">
            <a href="http://localhost:8000/admin/alunos/aluno/" class="btn-novo">+ Novo</a>
        </div>

        <div class="barra-filtros">
            <input type="text" id="pesquisa-aluno" placeholder="Pesquisar aluno ou modalidade...">

            <select id="filtro-modalidade">
                <option value>Todas modalidades</option>
                {% for mod in modalidades %}
                <option value="{{ mod.nome }}">{{ mod.nome }}</option>
                {% endfor %}
            </select>

        </div>
        <div class="tabela-container">

            <table class="tabela-sistema">

                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Modalidade</th>
                        <th>Status</th>
                        <th>Faixa</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="lista-alunos">
                </tbody>

            </table>

        </div>
    </main>

    <script src="{% static 'alunos/js/app.js' %}"></script>

</body>

</html>
